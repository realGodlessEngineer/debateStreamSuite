<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>Vertical Display</title>
  <link rel="stylesheet" href="css/themes/godless-engineer.css">
  <link rel="stylesheet" href="css/vertical-display.css">
</head>
<body>
  <!-- Show Info (top) - always visible when config exists -->
  <div id="showInfo" class="show-info-overlay">
    <div class="show-info-card">
      <div class="show-title" id="showTitleDisplay"></div>
      <div class="hosts-container" id="hostsContainer">
        <div class="host-card" id="host1Card">
          <div class="host-name" id="host1NameDisplay"></div>
          <div class="host-pronouns" id="host1PronounsDisplay"></div>
        </div>
        <div class="host-card hidden" id="host2Card">
          <div class="host-name" id="host2NameDisplay"></div>
          <div class="host-pronouns" id="host2PronounsDisplay"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Caller Card (bottom) - shown when caller is set.
       Same two-column lower third as the landscape overlay: identity on the
       left, meta cluster (stance chip + call timer) on the right. The card
       carries its own data-stance so the accent edge picks up the color. -->
  <div id="callerDisplay" class="caller-overlay">
    <div class="caller-card" id="callerCard" data-stance="">
      <span class="caller-accent"></span>
      <div class="caller-identity">
        <div class="caller-label">Caller</div>
        <div class="caller-name-row">
          <span class="caller-name" id="callerNameDisplay"></span>
          <span class="caller-pronouns" id="callerPronounsDisplay"></span>
        </div>
      </div>
      <div class="caller-meta">
        <div class="caller-stance" id="callerStanceDisplay" data-stance=""></div>
        <div class="caller-timer" id="callerTimerDisplay"></div>
      </div>
    </div>
  </div>

  <!-- Stage: topics list (mid-left) - shown via 'visible' class -->
  <div id="stageTopics" class="stage-topics">
    <div id="stageTopicsList"></div>
  </div>

  <!-- Stage: call-in pill (mid) - shown via 'visible' class -->
  <div id="stageCallIn" class="stage-callin">
    <span id="stageCallInText"></span>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/sanitize.js"></script>
  <script src="js/socket-connection.js"></script>
  <script src="js/theme-loader.js"></script>
  <script src="js/vertical-display.js"></script>
</body>
</html>
